name: Gerar narração (HeyGen)
on:
  push:
    branches: [main]
    paths: ["evil-tale-3d/narracao.txt", ".github/workflows/voz.yml"]
  workflow_dispatch:
    inputs:
      voice:
        description: "ID da voz (opcional)"
        default: ""
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF: npx -y hyperframes@0.8.223
      VOICE: ${{ inputs.voice }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Login HeyGen (aprovar pelo link)
        run: |
          git config --global user.name "render-bot"; git config --global user.email "render-bot@users.noreply.github.com"
          $HF auth login --device > login.log 2>&1 < /dev/null &
          PID=$!
          for i in $(seq 1 60); do grep -qo "https://[^ ]*" login.log && break; sleep 2; done
          cat login.log
          mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b login && grep -o "https://[^ ]*" $GITHUB_WORKSPACE/login.log > link.txt; sed 's/\x1b\[[0-9;]*m//g' $GITHUB_WORKSPACE/login.log > login.txt
          git add -A && git commit -q -m "link de login" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" login
          cd $GITHUB_WORKSPACE
          wait $PID
          $HF auth status
      - name: Narração e música
        run: |
          mkdir -p out evil-tale-3d/assets
          V=$(node tools/pick_voice.mjs | tail -1); echo "voz: $V"; echo "$V" > out/voz.txt
          node .agents/skills/media-use/audio/scripts/heygen-tts.mjs evil-tale-3d/narracao.txt -o evil-tale-3d/assets/narracao.wav --words evil-tale-3d/narracao.words.json --lang pt ${V:+--voice $V} 2>&1 | tee out/tts.log
          $HF media-use resolve --type bgm --intent "dark epic fantasy video game soundtrack, tense and mysterious, building to an emotional climax, cinematic" --project evil-tale-3d > out/bgm.log 2>&1 || echo "musica falhou" >> out/bgm.log
          cat out/bgm.log | tail -20
      - name: Salvar no repositório
        if: always()
        run: |
          cp out/voices.json evil-tale-3d/voices.json 2>/dev/null || true
          cp out/*.log out/voz.txt evil-tale-3d/ 2>/dev/null || true
          git add -A evil-tale-3d
          git commit -q -m "Narração e música do Evil Tale 3D [skip ci]" || true
          git pull -q --rebase && git push -q
