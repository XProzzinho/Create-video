name: Gerar narração
on:
  push:
    branches: [main]
    paths: ["evil-tale-3d/narracao.txt"]
  workflow_dispatch:
    inputs:
      voice:
        description: "ID da voz (opcional)"
        default: ""
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF: npx -y hyperframes@0.8.223
      KVOICE: ${{ inputs.voice }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Narração (voz grátis Kokoro, uma fala por linha)
        run: |
          git config --global user.name "render-bot"; git config --global user.email "render-bot@users.noreply.github.com"
          mkdir -p out evil-tale-3d/assets/falas
          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            i=$((i+1)); n=$(printf "%02d" $i)
            $HF tts "$line" --voice ${KVOICE:-pm_alex} --lang pt-br --speed 0.95 --output evil-tale-3d/assets/falas/fala-$n.wav 2>&1 | tail -2 | tee -a out/tts.log
          done < evil-tale-3d/narracao.txt
          ls -la evil-tale-3d/assets/falas | tee -a out/tts.log
      - name: Salvar no repositório
        if: always()
        run: |
                    cp out/tts.log evil-tale-3d/tts.log 2>/dev/null || true
          git add -A evil-tale-3d
          git commit -q -m "Narração e música do Evil Tale 3D [skip ci]" || true
          git pull -q --rebase && git push -q
