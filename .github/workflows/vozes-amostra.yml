name: Amostras de voz ElevenLabs
on:
  workflow_dispatch:
    inputs:
      project:
        default: "ferro2"
permissions:
  contents: write
jobs:
  amostra:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PROJ: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq ffmpeg
      - name: Gerar amostras (vozes padrão, modelo v3 e v2)
        run: |
          mkdir -p $PROJ/amostras
          TEXT="Fala, galera! Aqui é o Bessekai, e hoje eu vou te levar pra dentro de uma siderúrgica. Chuta aí: quanto pesa só um pneu desse caminhão?"
          printf "%s\n" "nPczCjzI2devNBz1zQrb Brian eleven_v3 0.5" "iP95p4xoKVk53GoZ742B Chris eleven_v3 0.5" "TX3LPaxmHKxFdv7VLQop Liam eleven_v3 0.5" "bIHbv24MWmeRgasZH58o Will eleven_v3 0.5" "pNInz6obpgDQGcFmaJgB Adam eleven_v3 0.5" > vozes.txt
          n=0
          while read -r vid name model stab; do
            n=$((n+1))
            body=$(jq -n --arg t "$TEXT" --arg m "$model" --argjson s "$stab" '{text:$t, model_id:$m, language_code:"pt", voice_settings:{stability:$s, similarity_boost:0.8, style:0.45, use_speaker_boost:true}}')
            code=$(curl -s -o "$PROJ/amostras/voz-$n.mp3" -w "%{http_code}" -X POST "https://api.elevenlabs.io/v1/text-to-speech/$vid?output_format=mp3_44100_128" -H "xi-api-key: $KEY" -H "Content-Type: application/json" -d "$body" < /dev/null)
            [ "$code" = "200" ] || { head -c 300 "$PROJ/amostras/voz-$n.mp3" > "$PROJ/amostras/erro-$n.txt"; rm -f "$PROJ/amostras/voz-$n.mp3"; }
            echo -e "$n\t$vid\t$name\t$model\t$stab\t$code" >> $PROJ/amostras/escolhas.tsv
          done < vozes.txt
          cat $PROJ/amostras/escolhas.tsv
      - name: Salvar
        if: always()
        run: |
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add -A $PROJ; git commit -q -m "Amostras de voz [skip ci]" || true; git pull -q --rebase && git push -q
