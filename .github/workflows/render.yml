name: Render video
on:
  push:
    branches: [main]
    paths: ["render-trigger.txt"]
  workflow_dispatch:
    inputs:
      project:
        description: "Pasta do projeto"
        default: "evil-tale-3d"
      start:
        description: "Renderizar a partir deste segundo (opcional)"
        default: ""
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT: ${{ inputs.project || 'evil-tale-3d' }}
      HF: npx -y hyperframes@0.8.223
      START: ${{ inputs.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Conferir, revisar e renderizar
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p ../out
          $HF check --json > ../out/check.json 2> ../out/check.log || true
          if [ -z "$START" ]; then $HF snapshot --review > ../out/snapshot.log 2>&1 || true; fi
          cp -r .hyperframes/artifacts/snapshots ../out/snapshots 2>/dev/null || true
          $HF render --quality looks ${START:+--start $START} --output ../out/video.mp4 > ../out/render.log 2>&1 || echo "RENDER FALHOU" >> ../out/render.log
          $HF audio ../out/video.mp4 --json > ../out/audio.json 2>&1 || true
          tail -60 ../out/render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: out/video.mp4
      - name: Publicar o vídeo original (sem compressão) como Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/video.mp4 ]; then
            TAG="${PROJECT}-$(date -u +%Y%m%d-%H%M)"
            cp out/video.mp4 "/tmp/${PROJECT}-original.mp4"
            gh release create "$TAG" "/tmp/${PROJECT}-original.mp4" --repo "${{ github.repository }}" --title "Vídeo ${PROJECT} ($(date -u +%d/%m/%Y))" --notes "Vídeo original em qualidade máxima, sem compressão. Gerado pelo robô." || echo "release falhou"
          fi
      - name: Deixar o vídeo abaixo de 95 MB (limite do GitHub)
        if: always()
        run: |
          if [ -f out/video.mp4 ] && [ $(stat -c%s out/video.mp4) -gt 95000000 ]; then
            ffmpeg -v error -y -i out/video.mp4 -c:v libx264 -preset veryfast -crf 24 -maxrate 4M -bufsize 8M -c:a copy -movflags +faststart out/small.mp4 && mv out/small.mp4 out/video.mp4
          fi
          ls -la out/video.mp4 || true
      - name: Publicar resultados no ramo "resultados"
        if: always()
        run: |
          cd out
          git init -q -b resultados
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Resultados de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultados
