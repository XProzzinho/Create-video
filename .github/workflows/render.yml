name: Render video
on:
  push:
  workflow_dispatch:
    inputs:
      project:
        description: "Pasta do projeto"
        default: "evil-tale"
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project || 'evil-tale' }}
      HF: npx -y hyperframes@0.8.223
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Conferir (check)
        working-directory: ${{ env.PROJECT }}
        run: $HF check --json > ../check.json || true; head -c 20000 ../check.json
      - name: Quadros de revisão (snapshot)
        working-directory: ${{ env.PROJECT }}
        run: $HF snapshot --review || true
      - name: Renderizar
        working-directory: ${{ env.PROJECT }}
        run: $HF render --quality looks --output ../video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao
          path: |
            check.json
            ${{ env.PROJECT }}/.hyperframes/artifacts/snapshots/
