name: Render em partes
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Pasta do projeto"
        required: true
      corte:
        description: "Segundos onde o vídeo é dividido, separados por vírgula"
        required: true
      quality:
        description: "draft, looks ou delivery"
        default: "delivery"
      fps:
        description: "30 ou 60"
        default: "60"
      so:
        description: "Renderizar só esta parte (vazio = todas)"
        default: ""
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.p.outputs.partes }}
    steps:
      - id: p
        run: |
          N=$(( $(echo "${{ inputs.corte }}" | tr ',' '\n' | grep -c .) + 1 ))
          if [ -n "${{ inputs.so }}" ]; then echo "partes=[${{ inputs.so }}]" >> $GITHUB_OUTPUT; else echo "partes=[$(seq -s, 1 $N)]" >> $GITHUB_OUTPUT; fi
  parte:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJson(needs.prep.outputs.partes) }}
    env:
      PROJECT: ${{ inputs.project }}
      HF: npx -y hyperframes@0.8.223
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Preparar a parte
        run: |
          TOT=$(grep -o 'id="root"[^>]*data-duration="[^"]*"' $PROJECT/index.html | grep -o 'data-duration="[^"]*"' | grep -o '[0-9.]*')
          PTS="0,${{ inputs.corte }},$TOT"; N=${{ matrix.parte }}
          INI=$(echo "$PTS" | cut -d, -f$N); FIM=$(echo "$PTS" | cut -d, -f$((N + 1)))
          echo "parte $N: $INI -> $FIM"
          python3 tools/partes.py $PROJECT $INI $FIM parte
      - name: Renderizar a parte ${{ matrix.parte }}
        working-directory: parte
        run: |
          mkdir -p ../out
          $HF render --quality ${{ inputs.quality }} --fps ${{ inputs.fps }} --output ../out/parte${{ matrix.parte }}.mp4 > ../out/render${{ matrix.parte }}.log 2>&1 || echo "RENDER FALHOU" >> ../out/render${{ matrix.parte }}.log
          tail -40 ../out/render${{ matrix.parte }}.log
          test -s ../out/parte${{ matrix.parte }}.mp4
      - name: Publicar a parte ${{ matrix.parte }} como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ matrix.parte }}
          TAG="${PROJECT}-parte${N}-$(date -u +%Y%m%d-%H%M)"
          cp out/parte${N}.mp4 "/tmp/${PROJECT}-parte${N}.mp4"
          gh release create "$TAG" "/tmp/${PROJECT}-parte${N}.mp4" --repo "${{ github.repository }}" --title "Vídeo ${PROJECT} — PARTE ${N}" --notes "Parte ${N} do vídeo. Gerado pelo robô."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parte${{ matrix.parte }}
          path: out/
  juntar:
    needs: parte
    if: inputs.so == ''
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: partes
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Juntar as partes
        run: |
          ls -la partes/*
          for f in $(ls -d partes/parte* | sort -V); do n=${f##*parte}; printf "file '%s'\n" "$PWD/$f/parte$n.mp4"; done > lista.txt; cat lista.txt
          ffmpeg -v error -y -f concat -safe 0 -i lista.txt -c copy -movflags +faststart video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4
      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${PROJECT}-$(date -u +%Y%m%d-%H%M)"
          cp video.mp4 "/tmp/${PROJECT}-original.mp4"
          gh release create "$TAG" "/tmp/${PROJECT}-original.mp4" --repo "${{ github.repository }}" --title "Vídeo ${PROJECT} ($(date -u +%d/%m/%Y))" --notes "Vídeo original em qualidade máxima, renderizado em partes e juntado. Gerado pelo robô."
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
